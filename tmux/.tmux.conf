# Terminal integration for tmux across Ghostty and kitty.
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -g set-clipboard on

# True color and clipboard support for local terminals.
# Reset the list first so re-sourcing this file stays idempotent, then
# restore tmux defaults and append our terminal overrides.
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title"
set -ga terminal-features "screen*:title"
set -ga terminal-features "rxvt*:ignorefkeys"
set -ga terminal-features ",ghostty:RGB"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-features ",xterm-256color:RGB"
set -ga terminal-features ",xterm-kitty:RGB,clipboard"
set -ga terminal-features ",kitty:RGB,clipboard"
# Use Ctrl-a as prefix and make it persistent.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Toggle pane zoom without prefix.
bind-key -n C-z resize-pane -Z


# macOS kitty -> ssh -> tmux clipboard flow works via OSC 52.
# In copy-mode, Enter copies the selection and exits.
bind-key -T copy-mode Enter send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

# Main pane on the left, stacked smaller panes on the right.
set-hook -g after-split-window "select-layout main-vertical"

# Ctrl-a then Enter: create a pane in the current working directory.
# The after-split hook places it in the right-side stack.
bind Enter split-window -v -c "#{pane_current_path}"

# Keep both asymmetric layouts one key apart for quick switching.
set -g main-pane-width 20%

# Ctrl-a then =: narrow left pane, wide right side, and focus its top pane.
bind = set-option -g main-pane-width 20% \; select-layout main-vertical \; select-pane -t '{top-right}'

# Ctrl-a then -: wide left pane, narrow right side, and focus the main pane.
bind - set-option -g main-pane-width 80% \; select-layout main-vertical \; select-pane -t '{top-left}'
